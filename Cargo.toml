[package]
name = "rmechrevo"
version = "0.1.0"
edition = "2024"
authors = ["Aut520 <aut@autkc.com>"]
description = "Native Rust Linux control center and privileged hardware daemon for Uniwill (INOU0000) laptops"
license = "GPL-3.0-only"
repository = "https://github.com/Aut520/rmechrevo"
homepage = "https://github.com/Aut520/rmechrevo"
autobins = false

[lib]
name = "rmechrevo_core"
path = "src/lib.rs"

[[bin]]
name = "rmechrevo"
path = "src/bin/gui.rs"

[[bin]]
name = "rmechrevo-daemon"
path = "src/bin/daemon.rs"

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2.190"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
